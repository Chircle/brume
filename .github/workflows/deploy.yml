name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deploy gleichzeitig; laufende Deploys werden nicht abgebrochen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Pages konfigurieren
        id: pages
        uses: actions/configure-pages@v5

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html og-image.png favicon.svg apple-touch-icon.png _site/

      - name: Seitenadresse in Meta-Tags eintragen
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          SITE_URL="${BASE_URL%/}/"
          sed -i "s#https://DEIN-NAME\.github\.io/brume/#${SITE_URL}#g" _site/index.html
          if grep -q "DEIN-NAME" _site/index.html; then
            echo "::error::Platzhalter DEIN-NAME wurde nicht vollständig ersetzt."
            exit 1
          fi
          echo "Meta-Tags zeigen auf: ${SITE_URL}"
          grep -o 'og:image" content="[^"]*' _site/index.html

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4